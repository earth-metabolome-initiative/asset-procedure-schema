name: Schema tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgres:
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        major: [17, 18]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - name: pgTAP behaviour, plpgsql_check and isolation specs on PostgreSQL ${{ matrix.major }}
        run: bash tests/run.sh ${{ matrix.major }}
