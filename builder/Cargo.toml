[package]
name = "builder"
version = "0.1.0"
edition = "2024"

[dependencies]
synql = { git = "https://github.com/connetto-rs/synql", branch = "main" }
sql-traits = { git = "https://github.com/connetto-rs/sql-traits", branch = "main" }
sqlippy = { git = "https://github.com/connetto-rs/SQLippy", branch = "main" }
connetto-schema-lint = { git = "https://github.com/connetto-rs/connetto-schema", rev = "f1c652535a19bc9a67f4b6959f06ce99d2751659" }
