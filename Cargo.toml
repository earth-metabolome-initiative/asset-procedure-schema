[workspace]
resolver = "2"
members = [
  "builder",
  "crates/sql-procedure-rules",
  "crates/sql-migration-lint",
  "crates/aps-traits",
  "crates/aps-test-utils",
  "crates/procedure-template-visitor",
  "crates/procedure-template-visualization",
  "crates/procedure-like",
  "aps/aps-sample_models",
  "aps/aps-grantees",
  "aps/aps-resources",
  "aps/aps-assets",
  "aps/aps-audit_events",
  "aps/aps-ball_mill_machine_models",
  "aps/aps-commercial_products",
  "aps/aps-geopositioning_devices",
  "aps/aps-centrifuge_models",
  "aps/aps-commercial_freeze_dryer_models",
  "aps/aps-commercial_freezer_models",
  "aps/aps-physical_asset_models",
  "aps/aps-procedures",
  "aps/aps-weighing_device_models",
  "aps/aps-photograph_procedure_templates",
  "aps/aps-platform_audit_events",
  "aps/aps-authz-audit_operation",
  "aps/aps-authz-grantee_kind",
  "aps/aps-authz-membership_state",
  "aps/aps-authz-resource_kind",
  "aps/aps-authz-role",
  "aps/aps-authz-team_role",
  "aps/aps",
  "aps/aps-dag-grantees",
  "aps/aps-dag-resources",
]

[workspace.package]
edition = "2024"

[workspace.dependencies]
builder = { path = "builder" }
sql-procedure-rules = { path = "crates/sql-procedure-rules" }
sql-migration-lint = { path = "crates/sql-migration-lint" }
aps-traits = { path = "crates/aps-traits" }
aps-test-utils = { path = "crates/aps-test-utils" }
procedure-template-visitor = { path = "crates/procedure-template-visitor" }
procedure-template-visualization = { path = "crates/procedure-template-visualization" }
procedure-like = { path = "crates/procedure-like" }
aps-sample_models = { version = "=0.1.0", path = "aps/aps-sample_models" }
aps-grantees = { version = "=0.1.0", path = "aps/aps-grantees" }
aps-resources = { version = "=0.1.0", path = "aps/aps-resources" }
aps-assets = { version = "=0.1.0", path = "aps/aps-assets" }
aps-audit_events = { version = "=0.1.0", path = "aps/aps-audit_events" }
aps-ball_mill_machine_models = { version = "=0.1.0", path = "aps/aps-ball_mill_machine_models" }
aps-commercial_products = { version = "=0.1.0", path = "aps/aps-commercial_products" }
aps-geopositioning_devices = { version = "=0.1.0", path = "aps/aps-geopositioning_devices" }
aps-centrifuge_models = { version = "=0.1.0", path = "aps/aps-centrifuge_models" }
aps-commercial_freeze_dryer_models = { version = "=0.1.0", path = "aps/aps-commercial_freeze_dryer_models" }
aps-commercial_freezer_models = { version = "=0.1.0", path = "aps/aps-commercial_freezer_models" }
aps-physical_asset_models = { version = "=0.1.0", path = "aps/aps-physical_asset_models" }
aps-procedures = { version = "=0.1.0", path = "aps/aps-procedures" }
aps-weighing_device_models = { version = "=0.1.0", path = "aps/aps-weighing_device_models" }
aps-photograph_procedure_templates = { version = "=0.1.0", path = "aps/aps-photograph_procedure_templates" }
aps-platform_audit_events = { version = "=0.1.0", path = "aps/aps-platform_audit_events" }
aps-authz-audit_operation = { version = "=0.1.0", path = "aps/aps-authz-audit_operation", features = [
  "sqlite",
] }
aps-authz-grantee_kind = { version = "=0.1.0", path = "aps/aps-authz-grantee_kind", features = [
  "sqlite",
] }
aps-authz-membership_state = { version = "=0.1.0", path = "aps/aps-authz-membership_state", features = [
  "sqlite",
] }
aps-authz-resource_kind = { version = "=0.1.0", path = "aps/aps-authz-resource_kind", features = [
  "sqlite",
] }
aps-authz-role = { version = "=0.1.0", path = "aps/aps-authz-role", features = [
  "sqlite",
] }
aps-authz-team_role = { version = "=0.1.0", path = "aps/aps-authz-team_role", features = [
  "sqlite",
] }
sqlparser = { version = "0.64", git = "https://github.com/apache/datafusion-sqlparser-rs", branch = "main" }
sql-values = { version = "0.7", git = "https://github.com/connetto-rs/sql-values", branch = "main" }
rosetta-utc = { version = "0.3.0", features = [
  "diesel",
  "serde",
  "postgres",
  "sqlite",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0" }
validation-errors = { version = "0.2.1" }
sqlitegis = { version = "0.3.1", features = ["diesel-postgres", "serde"] }
diesel = { version = "2.4.0", features = ["serde_json", "32-column-tables"] }
diesel-builders = { version = "0.2.1", features = [
  "postgres",
  "sqlite",
  "size-128",
] }
rosetta-uuid = { version = "0.2.0", features = [
  "diesel",
  "serde",
  "postgres",
  "sqlite",
] }

[patch.crates-io]
sqlparser = { git = "https://github.com/apache/datafusion-sqlparser-rs", branch = "main" }
sql-values = { git = "https://github.com/connetto-rs/sql-values", branch = "main" }
diesel = { git = "https://github.com/diesel-rs/diesel", branch = "upstream/sqlite-table-valued-functions-dynamic" }
sqlstate = { git = "https://github.com/diesel-rs/diesel", branch = "upstream/sqlite-table-valued-functions-dynamic" }

[workspace.lints.rust]
unused_macro_rules = "forbid"
unused_doc_comments = "forbid"
unconditional_recursion = "forbid"
unreachable_patterns = "forbid"
unused_import_braces = "forbid"
unused_must_use = "forbid"
deprecated = "deny"

[workspace.lints.rustdoc]
broken_intra_doc_links = "forbid"
bare_urls = "forbid"
invalid_codeblock_attributes = "forbid"
invalid_html_tags = "forbid"
unescaped_backticks = "forbid"
redundant_explicit_links = "forbid"
invalid_rust_codeblocks = "forbid"
