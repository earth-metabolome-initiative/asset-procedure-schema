[package]
name = "aps-test-utils"
version = "0.1.0"
edition.workspace = true

[dependencies]
pg2sqlite = { git = "https://github.com/connetto-rs/pg2sqlite", rev = "24a6278da4462e09f6ba8a1c9e36e1801c563698", default-features = false, features = [
  "std",
  "diesel",
  "sqlitegis",
] }
sql-traits = { git = "https://github.com/connetto-rs/sql-traits", branch = "main" }
sqlparser.workspace = true
sqlitegis = { workspace = true, features = ["diesel-sqlite", "bundled-sqlite"] }
serde.workspace = true
serde_json.workspace = true
rosetta-uuid.workspace = true
diesel-builders.workspace = true
diesel = { workspace = true, features = [
  "sqlite",
  "returning_clauses_for_sqlite_3_35",
] }
aps-grantees.workspace = true
aps-resources.workspace = true
aps-physical_asset_models.workspace = true
aps-authz-grantee_kind.workspace = true
aps-authz-membership_state.workspace = true
aps-authz-resource_kind.workspace = true
aps-authz-role.workspace = true
aps-traits.workspace = true

[dev-dependencies]
aps = { path = "../../aps/aps" }
procedure-like.workspace = true
rosetta-utc.workspace = true

[lints]
workspace = true
